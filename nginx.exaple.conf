server {
    listen 80;
    server_name mapops.example.com;
    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl http2;
    server_name mapops.example.com;

    ssl_certificate /etc/letsencrypt/live/mapops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mapops.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ORS
    location /ors/ {
        proxy_pass http://localhost:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nominatim (with syntetic prefix)
    location /nominatim/ {
        rewrite ^/nominatim/(.*)$ /$1 break;
        proxy_pass http://localhost:7070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photon (with syntetic prefix)
    location /photon/ {
        rewrite ^/photon/(.*)$ /$1 break;
        proxy_pass http://localhost:2322;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
