# Import compose (ephemeral). Not used directly day to day: ../mapops.sh
# orchestrates it (import/update). Paths are relative to this directory.
name: mapops-import

services:
  nominatim-importer:
    image: mediagis/nominatim:5.3
    container_name: nominatim-importer
    expose:
      - "5432"
    env_file: "vars.env"
    volumes:
      - ../nominatim-data:/var/lib/postgresql/16/main
      - ../maps:/data:ro
    # The import can take hours or days: the healthcheck only passes once it
    # finishes and gunicorn brings up the API (/status). The long start_period
    # avoids flagging the container unhealthy while it imports.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/status"]
      interval: 60s
      timeout: 5s
      retries: 4320
      start_period: 12h
    networks:
      - mapops

  photon-importer:
    image: ghcr.io/junisan/photon:1.3.0
    build:
      context: .
      args:
        PHOTON_VERSION: 1.3.0
    command: "import"
    container_name: photon-importer
    env_file: "vars.env"
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      nominatim-importer:
        condition: service_healthy
    volumes:
      - ../photon-data:/photon
    networks:
      - mapops

networks:
  # Created by the production compose (or by mapops.sh when missing)
  mapops:
    external: true
    name: mapops
