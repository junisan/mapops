name: Publish Photon image

on:
  push:
    branches: [master]
    paths:
      - 'importer/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read Photon version from the Dockerfile
        id: photon
        run: echo "version=$(sed -n 's/^ARG PHOTON_VERSION=//p' importer/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: importer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/junisan/photon:${{ steps.photon.outputs.version }}
            ghcr.io/junisan/photon:latest
