name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly: catches external rot (release assets, base images) without a push
    - cron: '0 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck mapops.sh
        run: shellcheck mapops.sh

      - name: Validate production compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate import compose
        run: |
          cp importer/vars.env.example importer/vars.env
          docker compose -f importer/docker-compose.yml config --quiet

      - name: Build the Photon image (verifies the jar sha256 and compiles the launcher)
        run: docker build importer/

  e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Prepare configuration
        run: |
          cp importer/vars.env.example importer/vars.env
          cp ors/config/ors-config.min.yml ors/config/ors-config.yml
          sudo chown -R 1000:1000 ors
          docker network create --attachable mapops

      - name: Fetch a small extract (Andorra)
        run: ./mapops.sh fetch europe/andorra

      - name: Full unattended import (Nominatim -> Photon -> ORS graphs)
        run: env UID=$(id -u) GID=$(id -g) ./mapops.sh import -y

      - name: Smoke tests (the same calls our consumers make)
        # Each check retries for up to a minute (right after the import the
        # services are still warming up: /status turns healthy before every
        # gunicorn worker can serve a real query) and dumps the last response
        # on failure so a red run carries its own diagnosis.
        run: |
          check() {
            local url="$1" pattern="$2" data="${3:-}" i resp=""
            for i in $(seq 1 12); do
              if [ -n "$data" ]; then
                resp="$(curl -sS -X POST -H 'Content-Type: application/json' -d "$data" "$url" 2>&1)" || true
              else
                resp="$(curl -sS -H 'Accept-Language: es' "$url" 2>&1)" || true
              fi
              if echo "$resp" | grep -q "$pattern"; then echo "OK: $url"; return 0; fi
              sleep 5
            done
            echo "FAILED: $url (pattern: $pattern)"
            echo "last response: $(echo "$resp" | head -c 1000)"
            return 1
          }
          check "http://localhost:17070/search?q=Andorra&format=json&limit=5&addressdetails=1" display_name
          check "http://localhost:17070/reverse?lat=42.5063&lon=1.5218&format=json&addressdetails=1" display_name
          check "http://localhost:17071/api?q=Meritxell&lang=es&limit=5" features
          check "http://localhost:17072/ors/v2/health" ready
          check "http://localhost:17072/ors/v2/directions/driving-car" routes '{"coordinates":[[1.5218,42.5063],[1.5341,42.5100]]}'

      - name: Status report
        if: always()
        run: ./mapops.sh status || true
