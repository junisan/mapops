# Rate-limiting zones must be declared in the http context (e.g. in
# /etc/nginx/nginx.conf or a conf.d file of your own). Tune to your traffic.
limit_req_zone $binary_remote_addr zone=mapops_api:10m rate=10r/s;

server {
    listen 80;
    server_name mapops.example.com;
    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl http2;
    server_name mapops.example.com;

    ssl_certificate /etc/letsencrypt/live/mapops.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mapops.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # The services have no authentication of their own: do not expose this
    # server block to the Internet unprotected (VPN, IP allowlist or auth_basic).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    limit_req zone=mapops_api burst=20 nodelay;
    limit_req_status 429;

    # ORS
    location /ors/ {
        proxy_pass http://localhost:17072/ors/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nominatim (with synthetic prefix)
    location /nominatim/ {
        rewrite ^/nominatim/(.*)$ /$1 break;
        proxy_pass http://localhost:17070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Photon (with synthetic prefix)
    location /photon/ {
        rewrite ^/photon/(.*)$ /$1 break;
        proxy_pass http://localhost:17071;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
